server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        client_max_body_size 26m;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend api:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
