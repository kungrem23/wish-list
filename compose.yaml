x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://wishlist_app@db:5432/wishlist?sslmode=disable
  PGPASSWORD: ${WISHLIST_DB_PASSWORD:-wishlist-local-app}
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: ${S3_BUCKET:-wishlist-photos}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-wishlist-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-wishlist-local-s3}

x-backend-dependencies: &backend-dependencies
  migrate:
    condition: service_completed_successfully
  s3:
    condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wishlist
      POSTGRES_DB: wishlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wishlist-local-db}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "wishlist", "-d", "wishlist"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: postgres:18-alpine
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      PGHOST: db
      PGUSER: wishlist
      PGDATABASE: wishlist
      PGPASSWORD: ${POSTGRES_PASSWORD:-wishlist-local-db}
      WISHLIST_DB_PASSWORD: ${WISHLIST_DB_PASSWORD:-wishlist-local-app}
      ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD:-wishlist-local-archive}
    volumes:
      - ./migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./docker/roles.sql:/roles.sql:ro
    depends_on:
      db:
        condition: service_healthy

  s3:
    image: chrislusf/seaweedfs:4.53
    environment:
      S3_BUCKET: ${S3_BUCKET:-wishlist-photos}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-wishlist-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-wishlist-local-s3}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "8333"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      <<: *backend-environment
      HTTP_ADDR: "127.0.0.1:8080"
      TRUSTED_PROXY_IP: "127.0.0.1"
      COOKIE_SECURE: "true"
    # Loopback is shared only with Nginx; no container-facing API port or dynamic proxy IP.
    network_mode: "service:web"
    depends_on:
      <<: *backend-dependencies
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "8080"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  archive:
    build:
      context: .
      target: archive
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://wishlist_archive@db:5432/wishlist?sslmode=disable
      PGPASSWORD: ${ARCHIVE_DB_PASSWORD:-wishlist-local-archive}
    depends_on: *backend-dependencies
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      NGINX_TRUSTED_PROXY: ${CADDY_PROXY_IP:?Set CADDY_PROXY_IP to the Caddy container IP on CADDY_NETWORK}
    networks:
      default:
      caddy:
        aliases:
          - wishlist-web
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:?Set CADDY_NETWORK to an existing network of the Caddy container}

volumes:
  postgres-data:
  s3-data:
